# 投稿可能時間帯の間3時間おきに起動し、自分が@メンションされた投稿を確認して返信する。
# X APIの仕様上、メンションされた投稿にはAPI経由で返信できるため、approvalMode: "auto"なら
# その場で返信まで行う。1回の起動でX API呼び出しが2回(v2.me() + メンションタイムライン取得)
# 発生するため、他のワークフロー(discover-replies.ymlなど)と同様に毎時ではなく低頻度にしている。
name: Handle Mentions

on:
  schedule:
    # JST 7:52, 10:52, 13:52, 16:52, 19:52, 22:52 (他のワークフローと起動時刻が重ならないよう52分にずらしている)。
    - cron: "52 22,1,4,7,10,13 * * *"
  workflow_dispatch: {}

# 他ワークフローと同じdb-writeグループを共有し、data/app.dbへの書き込みが競合しないよう直列化する。
concurrency:
  group: db-write
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  handle-mentions:
    # 【一時停止中 2026-09-10】botを一時停止しています。再開する場合はこの行を削除してください。
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Handle mentions
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: npm run handle-mentions

      - name: Commit DB changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/app.db
          if git diff --cached --quiet; then
            echo "no DB changes to commit"
            exit 0
          fi
          git commit -m "chore(db): update after handle-mentions run [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            echo "push failed, retrying ($i)..."
            sleep 5
          done
