# 1日4回、投稿候補を生成してGitHub Issueを作成する(approvalMode: autoの場合はその場で投稿まで行う)。
name: Generate Posts

on:
  schedule:
    # JST 10:00 / 14:00 / 19:00 / 21:00 (UTC 01:00 / 05:00 / 10:00 / 12:00)
    - cron: "0 1,5,10,12 * * *"
  workflow_dispatch: {}

# handle-approval.ymlと同じグループ名を共有し、data/app.dbへの書き込みが競合しないよう直列化する。
concurrency:
  group: db-write
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Generate candidate post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: npm run generate

      # SQLiteは外部ホスティングせずリポジトリに置いているため、実行後の状態をbotコミットで戻す。
      # concurrencyグループに加えてpull --rebaseのリトライも入れ、二重の備えで競合を防ぐ。
      # if: always() — 前段が失敗した場合でも、そこまでのDB変更は失わずコミットする。
      - name: Commit DB changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/app.db
          if git diff --cached --quiet; then
            echo "no DB changes to commit"
            exit 0
          fi
          git commit -m "chore(db): update after generate run [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            echo "push failed, retrying ($i)..."
            sleep 5
          done
