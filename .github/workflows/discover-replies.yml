# 他アカウントの投稿への返信候補を検索し、discovered_reply_targetsプールに貯めるだけの役割。
# 検索(X API呼び出し)は有料/レート制限があるため、generate-replies.yml(毎時)より
# 低頻度(3時間おき)で実行し、実際の返信案作成(Claude呼び出し・Issue作成)は
# generate-replies.ymlがこのプールから取り出して別途行う。
name: Discover Reply Candidates

on:
  schedule:
    - cron: "12 */3 * * *"
  workflow_dispatch: {}

# generate-posts.yml/generate-replies.ymlと同じdb-writeグループを共有し、
# data/app.dbへの書き込みが競合しないよう直列化する。
concurrency:
  group: db-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  discover-replies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Discover reply candidates
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: npm run discover-replies

      - name: Commit DB changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/app.db
          if git diff --cached --quiet; then
            echo "no DB changes to commit"
            exit 0
          fi
          git commit -m "chore(db): update after discover-replies run [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            echo "push failed, retrying ($i)..."
            sleep 5
          done
