# 週1回、返信検索キーワードごとの承認/却下実績を集計してClaudeに分析させ、
# reply_keyword_weights を更新する。generateReplyCandidate.ts(返信候補生成パイプライン)が
# この重みを参照し、承認されやすいキーワード由来の候補を優先して選ぶようになる。
name: Analyze Reply Keywords

on:
  schedule:
    # 毎週日曜 JST 11:22 (UTC 02:22)。analyze-posting-timesと時間帯をずらしている。
    - cron: "22 2 * * 0"
  workflow_dispatch: {}

concurrency:
  group: db-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Analyze reply keywords
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run analyze-reply-keywords

      # if: always() — 前段が失敗した場合でも、そこまでのDB変更は失わずコミットする。
      - name: Commit DB changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/app.db
          if git diff --cached --quiet; then
            echo "no DB changes to commit"
            exit 0
          fi
          git commit -m "chore(db): update after reply-keyword analysis [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            echo "push failed, retrying ($i)..."
            sleep 5
          done
