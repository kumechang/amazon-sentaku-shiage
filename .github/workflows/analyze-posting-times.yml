# 週1回、投稿ごとのエンゲージメント実績を時間帯別に集計してClaudeに分析させ、
# posting_time_weights を更新する。shouldGenerateNow(生成パイプライン)がこの重みを
# 参照し、反応の良い時間帯を優先して投稿候補を作るようになる。
name: Analyze Posting Times

on:
  schedule:
    # 毎週日曜 JST 09:37 (UTC 00:37)
    - cron: "37 0 * * 0"
  workflow_dispatch: {}

concurrency:
  group: db-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  analyze:
    # 【一時停止中 2026-09-10】botを一時停止しています。再開する場合はこの行を削除してください。
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Analyze posting times
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run analyze-posting-times

      # if: always() — 前段が失敗した場合でも、そこまでのDB変更は失わずコミットする。
      - name: Commit DB changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/app.db
          if git diff --cached --quiet; then
            echo "no DB changes to commit"
            exit 0
          fi
          git commit -m "chore(db): update after posting-time analysis [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            echo "push failed, retrying ($i)..."
            sleep 5
          done
