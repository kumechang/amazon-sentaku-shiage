# 返信承認用Issueへの「承認」/「却下」コメントを検知し、承認ならXへ返信する。
# handle-approval.ymlの返信版(ラベルが異なるだけで、混線しないよう完全に別ワークフローにしている)。
name: Handle Reply Approval

on:
  issue_comment:
    types: [created]

concurrency:
  group: db-write
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  handle-reply-approval:
    runs-on: ubuntu-latest
    # 【一時停止中 2026-09-10】先頭の `false &&` でbotを一時停止しています。
    # 再開する場合は `false &&` の行を削除してください(元の条件はそのまま残しています)。
    if: >
      false &&
      contains(github.event.issue.labels.*.name, 'pending-reply-approval') &&
      (contains(github.event.comment.body, '承認') || contains(github.event.comment.body, '却下'))
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Handle reply approval comment
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: npm run handle-reply-approval

      - name: Commit DB changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/app.db
          if git diff --cached --quiet; then
            echo "no DB changes to commit"
            exit 0
          fi
          git commit -m "chore(db): update after reply approval run [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && break
            echo "push failed, retrying ($i)..."
            sleep 5
          done
